# Move an object from a start pose to a target region. Start and target are adjustable per task config.
common:
  light_intensity: {nominal: 1.0, range: [0.7, 1.25], group: lighting}

objects:
  table:
    type: surface
    pos: [0, -0.12, 0.73]
    half_size: [0.65, 0.55, 0.03]
    friction: {nominal: 1.0, range: [0.6, 1.3], group: physics}

  cube:
    type: object
    surface: table
    shape: box
    half_size: [0.02, 0.02, 0.02]
    mass: {nominal: 0.08, range: [0.04, 0.15], group: physics}
    rgba: [0.85, 0.2, 0.2, 1]
    xy: {nominal: [-0.12, 0.06], jitter: [0.04, 0.03], group: pose}
    yaw_deg: {nominal: 0.0, jitter: 45.0, group: pose}

  target:
    type: region
    surface: table
    center_xy: {nominal: [0.10, -0.02], jitter: [0.04, 0.03], group: pose}
    radius: 0.05
