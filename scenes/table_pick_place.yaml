# Move one object from a start pose to a target region on the table.
# Override any start/target value from config: task.scene_overrides.object.start_xy.nominal=[0.1, 0.05]

common:
  light_intensity: {nominal: 1.0, range: [0.7, 1.25], group: lighting}

table:
  pos: [0, -0.12, 0.73]
  half_size: [0.65, 0.55, 0.03]
  friction: {nominal: 1.0, range: [0.6, 1.3], group: physics}
  rgba: [0.72, 0.70, 0.66, 1]

object:
  name: cube
  shape: box                         # box | cylinder | sphere
  half_size: [0.02, 0.02, 0.02]
  mass: {nominal: 0.08, range: [0.04, 0.15], group: physics}
  friction: {nominal: 1.0, range: [0.7, 1.4], group: physics}
  rgba: [0.85, 0.2, 0.2, 1]
  start_xy: {nominal: [-0.12, 0.06], jitter: [0.04, 0.03], group: pose}
  start_yaw_deg: {nominal: 0.0, jitter: 45.0, group: pose}

target:
  center_xy: {nominal: [0.10, -0.02], jitter: [0.04, 0.03], group: pose}
  radius: 0.05                       # success when the object rests within this distance of the centre
  rgba: [0.2, 0.6, 0.9, 0.5]         # flat marker drawn on the table

scoring:
  reach_radius: 0.05
  lift_height: 0.03
  settle_speed: 0.02                 # m/s: object must be at rest (and released) to count as placed
