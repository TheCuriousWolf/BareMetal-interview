# Kitchen counter with a sponge and a stain. World frame: z up, robots mounted along +y looking toward -y.
# Any value can be fixed (plain number) or randomized ({nominal, range|jitter, group}); see simeval/sim/randomization.py.

common:
  light_intensity: {nominal: 1.0, range: [0.7, 1.25], group: lighting}
  light_dir_jitter: {nominal: [0, 0, 0], jitter: [0.25, 0.25, 0], group: lighting}
  camera_jitter:            # small extrinsic error, as after a re-mount of the real cameras
    top: {pos: {nominal: [0, 0, 0], jitter: [0.01, 0.01, 0.01], group: camera},
          rot_deg: {nominal: [0, 0, 0], jitter: [1.0, 1.0, 1.0], group: camera}}

counter:
  pos: [0, -0.12, 0.73]           # box centre
  half_size: [0.65, 0.55, 0.03]   # top surface at z = 0.76
  friction: {nominal: 1.0, range: [0.6, 1.3], group: physics}
  rgba: {nominal: [0.72, 0.70, 0.66, 1], jitter: [0.06, 0.06, 0.06, 0], group: appearance}   # light laminate

sponge:
  half_size: [0.045, 0.030, 0.0175]   # 9 x 6 x 3.5 cm kitchen sponge
  size_scale: {nominal: 1.0, range: [0.85, 1.15], group: shape}
  mass: {nominal: 0.025, range: [0.015, 0.05], group: physics}   # dry to damp
  friction: {nominal: 1.2, range: [0.8, 1.6], group: physics}
  # Soft contact stands in for foam compliance (rigid body, compliant contact).
  solref: [0.02, 1.0]
  solimp: [0.7, 0.95, 0.006]
  start_xy: {nominal: [-0.13, 0.07], jitter: [0.04, 0.03], group: pose}
  start_yaw_deg: {nominal: 0.0, jitter: 30.0, group: pose}
  foam_rgba: [0.96, 0.82, 0.25, 1]
  scour_rgba: [0.18, 0.45, 0.22, 1]

stain:
  center_xy: {nominal: [0.06, -0.02], jitter: [0.05, 0.03], group: pose}
  radius: {nominal: 0.04, range: [0.03, 0.05], group: shape}
  roughness: 0.25                 # boundary wobble as a fraction of the radius
  cell: 0.008                     # grid resolution of the dirt map (m)
  rgba: {nominal: [0.36, 0.22, 0.10, 0.9], choices: [[0.36, 0.22, 0.10, 0.9], [0.55, 0.12, 0.08, 0.85], [0.25, 0.25, 0.22, 0.8]], group: appearance}

scoring:
  min_press_force: 0.5            # N of sponge-on-counter normal force before scrubbing counts
  scrub_distance_to_clean: 0.08   # m of sponge travel over a cell, under pressure, to clean it
  require_grasp: true             # pushing a loose sponge around does not count
  success_fraction: 0.8           # cleaned-cell fraction for success
  reach_radius: 0.06              # TCP-to-sponge distance for the "reached" stage
  lift_height: 0.02               # sponge rise while grasped for the "lifted" stage
