# Kitchen counter with a sponge and a stain. World frame: z up, robots mounted along +y looking toward -y.
# Each entry under `objects` is an interactable (simeval/scene/interactables.py).
# Any value can be fixed or randomized: {nominal, range | jitter | choices, group}. Groups sampled per level:
#   none: nothing   pose: pose   full: pose, shape, physics, lighting, camera, appearance

common:
  light_intensity: {nominal: 1.0, range: [0.7, 1.25], group: lighting}
  light_dir_jitter: {nominal: [0, 0, 0], jitter: [0.25, 0.25, 0], group: lighting}
  camera_jitter:            # small extrinsic error, as after re-mounting the real camera
    top: {pos: {nominal: [0, 0, 0], jitter: [0.01, 0.01, 0.01], group: camera},
          rot_deg: {nominal: [0, 0, 0], jitter: [1.0, 1.0, 1.0], group: camera}}

objects:
  counter:
    type: surface
    pos: [0, -0.12, 0.73]           # box centre; top surface at z = 0.76
    half_size: [0.65, 0.55, 0.03]
    friction: {nominal: 1.0, range: [0.6, 1.3], group: physics}
    rgba: {nominal: [0.72, 0.70, 0.66, 1], jitter: [0.06, 0.06, 0.06, 0], group: appearance}

  sponge:
    type: sponge
    surface: counter
    half_size: [0.045, 0.030, 0.0175]   # 9 x 6 x 3.5 cm
    size_scale: {nominal: 1.0, range: [0.85, 1.15], group: shape}
    mass: {nominal: 0.025, range: [0.015, 0.05], group: physics}
    friction: {nominal: 1.2, range: [0.8, 1.6], group: physics}
    xy: {nominal: [-0.13, 0.07], jitter: [0.04, 0.03], group: pose}
    yaw_deg: {nominal: 0.0, jitter: 30.0, group: pose}
    rgba: [0.96, 0.82, 0.25, 1]
    solref: [0.02, 1.0]             # compliant contact stands in for foam
    solimp: [0.7, 0.95, 0.006]

  stain:
    type: spill
    surface: counter
    erased_by: sponge
    center_xy: {nominal: [0.06, -0.02], jitter: [0.05, 0.03], group: pose}
    radius: {nominal: 0.04, range: [0.03, 0.05], group: shape}
    rgba: {nominal: [0.36, 0.22, 0.10, 0.9], choices: [[0.36, 0.22, 0.10, 0.9], [0.55, 0.12, 0.08, 0.85], [0.25, 0.25, 0.22, 0.8]], group: appearance}
    cell: 0.008                     # decal size (m)
    min_press_force: 0.5            # N the tool must press with for wiping to count
    scrub_distance: 0.08            # m of tool travel over a decal to erase it
    require_grasp: true             # pushing a loose sponge around does not count
